<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JustPrintIt</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar">
      <div class="brand">
        <span class="mark">JP</span> JustPrintIt
      </div>
      <div id="sidebar-nav"></div>
      <div class="sidebar-footer" id="sidebar-footer"></div>
    </nav>
    <div class="main-scroll">
      <div class="topbar">
        <button class="icon-btn" id="sidebar-collapse-btn" data-icon="panel" title="Toggle sidebar"></button>
        <span class="topbar-title" id="topbar-title">Dashboard</span>
        <div class="topbar-actions">
          <button class="icon-btn" id="topbar-bell" data-icon="bell" title="Notifications"></button>
          <button class="icon-btn" id="topbar-sparkles" data-icon="sparkles" title="Assistant"></button>
          <button class="icon-btn" id="topbar-help" data-icon="help" title="Help"></button>
          <button class="icon-btn" id="theme-toggle" data-icon="moon" title="Toggle dark mode"></button>
        </div>
      </div>
      <main class="main" id="main"></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="/core.js"></script>
  <script src="/page-dashboard.js"></script>
  <script src="/page-orders.js"></script>
  <script src="/page-resource.js"></script>
  <script src="/page-quotes.js"></script>
  <script src="/page-printers.js"></script>
  <script src="/page-maintenance.js"></script>
  <script src="/page-reports.js"></script>
  <script src="/page-settings.js"></script>
  <script src="/app-init.js"></script>
</body>
</html>
