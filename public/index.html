<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JustPrintIt</title>
  <link rel="stylesheet" href="/styles.css" />
  <!-- Static default so the tab isn't blank before settings load; initShell()
       in core.js swaps this for the real brand icon/color once available. -->
  <link rel="icon" type="image/svg+xml" id="favicon-link" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e2793c'/%3E%3Ctext x='16' y='22' font-family='Arial, Helvetica, sans-serif' font-size='15' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EJP%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar">
      <div class="brand">
        <span class="mark" id="brand-mark">JP</span><span id="brand-name-text">JustPrintIt</span>
        <span class="beta-badge" id="beta-badge" title="This app is a work in progress - things may change or break.">BETA</span>
      </div>
      <div id="sidebar-nav"></div>
    </nav>
    <div class="main-scroll">
      <div class="topbar">
        <button class="icon-btn" id="sidebar-collapse-btn" data-icon="panel" data-tooltip="Toggle sidebar" aria-label="Toggle sidebar"></button>
        <span class="topbar-title" id="topbar-title">Dashboard</span>
        <div class="topbar-actions">
          <button class="icon-btn" id="topbar-bell" data-tooltip="Notifications" aria-label="Notifications"><span data-icon="bell"></span><span class="notif-badge" id="bell-badge" style="display:none;"></span></button>
          <button class="icon-btn" id="topbar-sparkles" data-icon="sparkles" data-tooltip="What's New" aria-label="What's New"></button>
          <button class="icon-btn" id="topbar-help" data-icon="help" data-tooltip="Help" aria-label="Help"></button>
          <button class="icon-btn" id="theme-toggle" data-icon="moon" data-tooltip="Toggle dark mode" aria-label="Toggle dark mode"></button>
        </div>
      </div>
      <main class="main" id="main"></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="modal-root-2"></div>
  <div id="toast-root"></div>
  <script src="/core.js"></script>
  <script src="/page-dashboard.js"></script>
  <script src="/page-orders.js"></script>
  <script src="/page-customers.js"></script>
  <script src="/page-inventory.js"></script>
  <script src="/page-filament.js"></script>
  <script src="/page-expenses.js"></script>
  <script src="/page-products.js"></script>
  <script src="/page-invoices.js"></script>
  <script src="/page-quotes.js"></script>
  <script src="/page-printers.js"></script>
  <script src="/page-maintenance.js"></script>
  <script src="/page-reports.js"></script>
  <script src="/page-requests.js"></script>
  <script src="/page-settings.js"></script>
  <script src="/app-init.js"></script>
</body>
</html>
